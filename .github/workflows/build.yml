name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'Documentation/**'
      - '.github/CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/labels/**'
      - 'Utilities/Maintenance/**'
      - 'Utilities/misc/**'
      - 'legal/**'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'Documentation/**'
      - '.github/CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/labels/**'
      - 'Utilities/Maintenance/**'
      - 'Utilities/misc/**'
      - 'legal/**'
      - 'docs/**'
  # Weekly build of main keeps the ccache inside GitHub's 7-day eviction
  # window and surfaces runner-image or compiler upgrades on main instead
  # of on an unrelated PR.  Runs after the 06:00 UTC cache sweep.
  # The nightly run builds only the ITK main legs, which keeps main's ccache warm for
  # pull requests; the weekly run builds only the release-pinned legs.
  schedule:
    - cron: '0 8 * * 1'
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      itk_ref:
        description: 'ITK branch, tag, or SHA for the ITK main legs'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

env:
  # Tests that exceed CI time limits or diverge between compilers; shared by the
  # normal and sanitizer test steps.  CMake/CTestCustom.cmake.in also ignores the BCD tests.
  CTEST_EXCLUDE_REGEX: '^(BCD|chk_.*BCD|BRAINSABCSmallTest|BRAINSFitTest_RigidRotationNoMasks|BRAINSPosteriorToContinuousClassTest|BRAINSCreateLabelMapFromProbabilityMapsTest|BRAINSFitTest_ScaleTranslationRescaleHeadMasksNoInit)'

concurrency:
  group: '${{ github.workflow }}@${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: Select build legs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
      - name: Choose legs for this event
        id: legs
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json
          import os

          schedule = os.environ["SCHEDULE"]
          nightly = schedule == "0 9 * * *"
          weekly = schedule == "0 8 * * 1"
          # x86-64-v3 (AVX2, FMA, BMI) is supported by every GitHub-hosted ubuntu-latest
          # runner, and a fixed string keeps ccache keys stable across hosts.
          # -mcpu=apple-m1 runs unchanged on later Apple Silicon.
          platforms = [
              {
                  "name": "Ubuntu Latest GCC",
                  "os": "ubuntu-latest",
                  "cc": "gcc",
                  "cxx": "g++",
                  "parallel": "$(nproc)",
                  "arch_flags": "-march=x86-64-v3 -mtune=generic",
              },
              {
                  "name": "macOS Latest Clang",
                  "os": "macos-latest",
                  "cc": "clang",
                  "cxx": "clang++",
                  "parallel": "$(sysctl -n hw.ncpu)",
                  "arch_flags": "-mcpu=apple-m1",
              },
          ]
          legs = []
          if not nightly:
              legs += [dict(p, itk_ref="") for p in platforms]
          if not weekly:
              legs += [dict(p, name=p["name"] + " (ITK main)", itk_ref="main") for p in platforms]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(legs) + "\n")
          PY

  build:
    name: ${{ matrix.config.name }}
    needs: setup
    runs-on: ${{ matrix.config.os }}
    # A cold ITK main build has no ccache to lean on.
    timeout-minutes: ${{ matrix.config.itk_ref != '' && 360 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      # ── Checkout & version extraction ─────────────────────────────────────────
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve ITK ref
        id: itk
        shell: bash
        env:
          ITK_REF: ${{ matrix.config.itk_ref && (inputs.itk_ref || matrix.config.itk_ref) || '' }}
        run: |
          # Empty ITK_REF keeps the SuperBuild's pinned ITK; otherwise build the commit
          # the ref points at now, so ccache keys and the log name an exact SHA.
          if [ -z "${ITK_REF}" ]; then
            { echo "sha="; echo "keytag="; echo "cdash="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "${ITK_REF}" | grep -qE '^[0-9a-f]{40}$'; then
            SHA="${ITK_REF}"
          else
            SHA=$(git ls-remote https://github.com/InsightSoftwareConsortium/ITK.git \
                    "refs/heads/${ITK_REF}" "refs/tags/${ITK_REF}" | head -1 | cut -f1)
          fi
          if [ -z "${SHA}" ]; then
            echo "::error::ITK ref '${ITK_REF}' not found"
            exit 1
          fi
          TAG=itk-other
          [ "${ITK_REF}" = "main" ] && TAG=itk-main
          { echo "sha=${SHA}"; echo "keytag=${TAG}-"; echo "cdash=:${TAG}"; } >> "$GITHUB_OUTPUT"
          echo "### Built against ITK ${ITK_REF} @ ${SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract BRAINSTools version
        id: btversion
        shell: bash
        run: |
          # Parse VERSION from the project() call in CMakeLists.txt, e.g. "VERSION 5.8.0"
          VERSION=$(grep -m1 '^ *VERSION [0-9]' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          echo "version=${VERSION}"       >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
          echo "BRAINSTools version: ${VERSION}  (MAJOR.MINOR: ${MAJOR_MINOR})"

      - name: Compute CDash build-name suffix
        id: cdash_suffix
        shell: bash
        env:
          # PR number: set for pull_request events, empty for push events.
          PR_NUM: ${{ github.event.number }}
          # Branch name: head_ref (PRs) or ref_name (direct pushes); attacker-controlled, so never inline it.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ITK_CDASH: ${{ steps.itk.outputs.cdash }}
        run: |
          # Slugify: lowercase, collapse non-alphanumeric runs to '-', strip edges.
          SLUG=$(echo "${BRANCH}" | tr '[:upper:]' '[:lower:]' \
                   | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//')
          SUFFIX=":${PR_NUM:-0}:${SLUG}${ITK_CDASH}"
          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "CDash BuildName suffix: ${SUFFIX}"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # ── Runner preparation ─────────────────────────────────────────────────────
      - name: Free Disk Space (Ubuntu)
        if: matrix.config.os == 'ubuntu-latest'
        uses: BRAINSia/free-disk-space@f9f59b0ef974ff4b873aa243ce5278ab644eedc6 # v2
        with:
          removalmode: "rmz"
          # BRAINSTools SuperBuild builds ITK, ANTs, SEM, TBB, and the inner
          # BRAINSTools tools.  On ubuntu-latest (~14 GB free by default) the
          # full build consumes 8-12 GB.  Freeing pre-installed language
          # runtimes and unused tool-cache entries recovers 15-20 GB, ensuring
          # the build never runs out of disk space.
          #
          # TIME_REPORT for this action on ubuntu-latest (approximate):
          #   swap-storage  |  0 s  | 4.0 GiB freed
          #   haskell       | 10 s  | 6.2 GiB freed
          #   dotnet        | 27 s  | 3.3 GiB freed
          #   tool-cache    | 90 s  | 5.3 GiB freed
          #   mandb         |  2 s  | speeds apt-get (no man pages in CI)
          swap-storage:   "true"
          haskell:        "true"
          dotnet:         "true"
          docker-images:  "false"  # Too slow (~80 s) for only 3.4 GiB
          tool-cache:     "true"
          android:        "false"  # Too slow (~300 s) for only 8.8 GiB
          large-packages: "false"  # Too slow for marginal gain in this build
          mandb:          "true"

      - name: Install Dependencies (Ubuntu)
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache \
            libx11-dev libxt-dev libgl1-mesa-dev libglu1-mesa-dev \
            locales
          # Generate a comma-decimal locale so that LocaleSafeConversionsTest
          # can exercise locale-independence on the CI runner.
          # Pattern adopted from ITK's CI workflow (pixi.yml / arm.yml).
          sudo locale-gen de_DE.UTF-8

      # The 16 GB runner has no swap, and a cold GCC 15 build of VTK exhausts its memory.
      - name: Add swap and keep compiler temp files off the RAM-backed /tmp (Ubuntu)
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - name: Install Dependencies (macOS)
        if: matrix.config.os == 'macos-latest'
        run: |
          brew install ninja ccache

      - name: Install Dependencies (Windows)
        if: matrix.config.os == 'windows-latest'
        run: |
          choco install ninja ccache --yes

      # ── Compiler cache (ccache) ────────────────────────────────────────────────
      - name: Record runner image and compiler
        id: toolchain
        shell: bash
        run: |
          # ImageOS/ImageVersion are set on GitHub-hosted runners (e.g. ubuntu24, 20251019.1).
          IMAGE="${ImageOS:-unknown}"
          COMPILER_MAJOR=$(${{ matrix.config.cxx }} -dumpversion 2>/dev/null | cut -d. -f1)
          echo "image=${IMAGE}"                     >> "$GITHUB_OUTPUT"
          echo "compiler_major=${COMPILER_MAJOR:-0}" >> "$GITHUB_OUTPUT"
          echo "Runner image: ${IMAGE} ${ImageVersion:-}"
          ${{ matrix.config.cxx }} --version | head -1

      - name: Configure ccache
        shell: bash
        run: |
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"       >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content"             >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=true"                    >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${{ runner.temp }}/ccache"     >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=5G"                        >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESSLEVEL=1"                   >> "$GITHUB_ENV"

      - name: Restore compiler cache
        id: restore-ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-${{ steps.itk.outputs.keytag }}${{ runner.os }}-${{ steps.toolchain.outputs.image }}-${{ matrix.config.cxx }}${{ steps.toolchain.outputs.compiler_major }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ steps.itk.outputs.keytag }}${{ runner.os }}-${{ steps.toolchain.outputs.image }}-${{ matrix.config.cxx }}${{ steps.toolchain.outputs.compiler_major }}-

      - name: Show ccache config and stats
        shell: bash
        run: |
          ccache --zero-stats
          ccache --evict-older-than 60d
          ccache --show-config

      # ── Test data cache (ExternalData) ────────────────────────────────────────
      # Restore-only: populate-externaldata-cache.yml is the sole writer.
      - name: Restore ExternalData object store
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ExternalData
          key: externaldata-v2-${{ hashFiles('**/*.sha512') }}
          restore-keys: |
            externaldata-v2-
            ExternalData-BRAINSTools-

      - name: Set ExternalData_OBJECT_STORES env var
        shell: bash
        run: |
          # BRAINSToolsExternalData.cmake reads this env var at cmake configure
          # time and adds it as the first search path for ExternalData objects.
          mkdir -p "${{ runner.temp }}/ExternalData"
          echo "ExternalData_OBJECT_STORES=${{ runner.temp }}/ExternalData" >> "$GITHUB_ENV"

      # ── SuperBuild: Configure + build all EPs and inner BRAINSTools ──────────────
      #
      # Builds all third-party ExternalProject dependencies (ITKv5, ANTs,
      # SlicerExecutionModel, TBB, zlib) and the inner BRAINSTools project in a
      # single cmake configure + build invocation.  ccache accelerates repeated
      # compilation of unchanged translation units across runs.
      # ──────────────────────────────────────────────────────────────────────────
      - name: "SuperBuild: Configure CMake"
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.config.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_STANDARD:STRING=17 \
            -DCMAKE_C_FLAGS="${{ matrix.config.arch_flags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.config.arch_flags }}" \
            -DBRAINSToools_C_OPTIMIZATION_FLAGS:STRING="${{ matrix.config.arch_flags }}" \
            -DBRAINSToools_CXX_OPTIMIZATION_FLAGS:STRING="${{ matrix.config.arch_flags }}" \
            ${{ matrix.config.os == 'ubuntu-latest' && '-DOpenGL_GL_PREFERENCE:STRING=GLVND' || '' }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXTERNAL_PROJECT_BUILD_TYPE:STRING=Release \
            -DBUILD_TESTING=ON \
            -DBUILD_SHARED_LIBS=ON \
            ${{ steps.itk.outputs.sha && format('-DBRAINSTools_ITKv5_GIT_TAG:STRING={0}', steps.itk.outputs.sha) || '' }} \
            -DBRAINSTools_REQUIRES_VTK=ON \
            -DBRAINSTools_USE_GIT_PROTOCOL:BOOL=OFF \
            -DBRAINSTools_BUILD_DICOM_SUPPORT:BOOL=ON \
            -DUSE_BRAINSABC:BOOL=ON \
            -DUSE_BRAINSConstellationDetector:BOOL=ON \
            -DUSE_BRAINSCreateLabelMapFromProbabilityMaps:BOOL=ON \
            -DUSE_BRAINSDeface:BOOL=ON \
            -DUSE_BRAINSDWICleanup:BOOL=OFF \
            -DUSE_BRAINSInitializedControlPoints:BOOL=ON \
            -DUSE_BRAINSIntensityNormalize:BOOL=ON \
            -DUSE_BRAINSLabelStats:BOOL=ON \
            -DUSE_BRAINSLandmarkInitializer:BOOL=ON \
            -DUSE_BRAINSMultiModeSegment:BOOL=OFF \
            -DUSE_BRAINSMultiSTAPLE:BOOL=OFF \
            -DUSE_BRAINSMush:BOOL=OFF \
            -DUSE_BRAINSPosteriorToContinuousClass:BOOL=ON \
            -DUSE_BRAINSResample:BOOL=ON \
            -DUSE_BRAINSROIAuto:BOOL=ON \
            -DUSE_BRAINSSnapShotWriter:BOOL=OFF \
            -DUSE_BRAINSStripRotation:BOOL=OFF \
            -DUSE_BRAINSTransformConvert:BOOL=ON \
            -DUSE_ConvertBetweenFileFormats:BOOL=ON \
            -DUSE_DWIConvert:BOOL=ON \
            -DUSE_GTRACT:BOOL=ON \
            -DUSE_ImageCalculator:BOOL=ON \
            -DUSE_ReferenceAtlas:BOOL=OFF \
            -DUSE_AutoWorkup:BOOL=OFF \
            -DUSE_BRAINSConstellationDetectorGUI:BOOL=OFF \
            -DUSE_DebugImageViewer:BOOL=OFF \
            -DUSE_BRAINSSuperResolution:BOOL=OFF

      - name: "SuperBuild: Build (EP dependencies + inner BRAINSTools)"
        shell: bash
        run: |
          # Builds ITKv5, ANTs, SlicerExecutionModel, TBB, zlib, then inner BRAINSTools.
          # ccache handles incremental compilation across CI runs.
          # Log memory each minute so an out-of-memory runner loss is visible in the step log.
          if command -v free > /dev/null; then
            while sleep 60; do echo "[mem] $(free -m | awk '/^(Mem|Swap):/ {printf "%s %s/%s MiB  ", $1, $3, $2}')"; done &
            mem_logger=$!
            trap 'kill "${mem_logger}" 2> /dev/null' EXIT
          fi
          cmake --build build --config Release --parallel ${{ matrix.config.parallel }}

      # The SuperBuild forwards BRAINSToools_*_OPTIMIZATION_FLAGS to ITK, whose flags come after
      # CMAKE_CXX_FLAGS and win.  Their default of -march=native bakes the runner's CPU into ITK
      # objects, which crash with SIGILL when ccache hands them to an older runner.
      - name: "Verify ITK was built with the portable arch flags"
        shell: bash
        run: |
          flags=$(grep -E '^ITK_(C|CXX)_OPTIMIZATION_FLAGS:' build/ITKv5-Release-build/CMakeCache.txt)
          echo "${flags}"
          if echo "${flags}" | grep -qE -- '-m(arch|tune|cpu)=native'; then
            echo "::error::ITK was configured with host-specific flags; ccache entries would not be portable across runners"
            exit 1
          fi

      # ── Compiler & test-data cache save ───────────────────────────────────────
      - name: Save compiler cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-${{ steps.itk.outputs.keytag }}${{ runner.os }}-${{ steps.toolchain.outputs.image }}-${{ matrix.config.cxx }}${{ steps.toolchain.outputs.compiler_major }}-${{ github.sha }}

      - name: Show ccache statistics
        if: always()
        shell: bash
        run: |
          # Full verbose stats to the log for deep-dive debugging.
          ccache --show-stats -v

      - name: Report ccache hit rate
        if: always()
        shell: bash
        run: |
          # Parse ccache --show-stats output and compute the hit rate.
          # Uses python3 for parsing and arithmetic so the step works on both
          # macOS (bash 3.2, ccache 4.9+ JSON --print-stats) and Linux (bash 5.x).
          #
          # Two bugs were present in the prior awk+bash implementation:
          #   1. ccache 4.9+ changed --print-stats to JSON output; the awk
          #      key=value parser silently returned empty for every field.
          #   2. ${var:0:-1} (negative length) is not supported in bash 3.2
          #      (macOS /bin/bash), causing "hit_rate: unbound variable" when
          #      total_lookups > 0.
          set -euo pipefail
          ccache --show-stats > /tmp/ccache-stats.txt || true

          # Parse and compute everything in python3 (one logical line so YAML
          # indentation rules are satisfied; python3 top-level code cannot be
          # indented, so a heredoc is not usable inside a YAML literal block).
          eval "$(python3 -c 'import re; t=open("/tmp/ccache-stats.txt").read(); F=re.IGNORECASE|re.MULTILINE; fi=lambda p,d=0: next((int(m.group(1)) for m in [re.search(p,t,F)] if m),d); ff=lambda p,d=0.0: next((float(m.group(1)) for m in [re.search(p,t,F)] if m),d); dh=fi(r"^\s+Direct[^:]*:\s+(\d+)"); ph=fi(r"^\s+Preprocessed[^:]*:\s+(\d+)"); cm=fi(r"^\s+Misses[^:]*:\s+(\d+)"); csm=int(ff(r"Cache size \(GB\)[^:]*:\s+([\d.]+)")*1024); th=dh+ph; tl=th+cm; hr=f"{100*th/tl:.1f}" if tl>0 else "n/a"; [print(f"{k}={v}") for k,v in [("direct_hit",dh),("preprocessed_hit",ph),("cache_miss",cm),("total_hit",th),("total_lookups",tl),("hit_rate",hr),("cache_size_mib",csm)]]')"

          {
            echo "## ccache hit rate — ${{ matrix.config.name }}"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Direct hits        | ${direct_hit} |"
            echo "| Preprocessed hits  | ${preprocessed_hit} |"
            echo "| Cache misses       | ${cache_miss} |"
            echo "| **Total hits**     | **${total_hit}** |"
            echo "| **Total lookups**  | **${total_lookups}** |"
            echo "| **Hit rate (%)**   | **${hit_rate}** |"
            echo "| Cache size (MiB)   | ${cache_size_mib} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=ccache hit rate (${{ matrix.config.name }})::${hit_rate}% (${total_hit}/${total_lookups}), size ${cache_size_mib} MiB"

      # ── Inner build: CTest dashboard reporting ────────────────────────────────
      #
      # CTest Experimental* steps perform a clean rebuild of the inner project
      # and submit results to the CDash dashboard.  The "ninja clean" ensures
      # compilation warnings and errors are freshly reported rather than
      # inherited from the SuperBuild Phase II compile above.
      # ──────────────────────────────────────────────────────────────────────────
      - name: "Inner Build: Clean before CTest dashboard run"
        working-directory: build/BRAINSTools-Release-EPRelease-build
        shell: bash
        run: ninja clean

      - name: "Inner Build: Append PR + branch suffix to CDash BuildName"
        # DartConfiguration.tcl is the file CTest reads for BuildName; it is
        # generated during the SuperBuild and contains a line such as:
        #   BuildName: Linux-g++
        # Appending :PR:slug lets CDash group and filter submissions by PR/branch.
        # python3 is used instead of sed to avoid BSD/GNU sed -i portability issues.
        shell: bash
        env:
          CDASH_SUFFIX: ${{ steps.cdash_suffix.outputs.suffix }}
          DART: build/BRAINSTools-Release-EPRelease-build/DartConfiguration.tcl
        run: |
          python3 -c "
          import os, re
          dart   = os.environ['DART']
          suffix = os.environ['CDASH_SUFFIX']
          txt    = open(dart).read()
          txt    = re.sub(r'^(BuildName:.*)$', r'\1' + suffix, txt, flags=re.MULTILINE)
          open(dart, 'w').write(txt)
          m = re.search(r'^BuildName:.*$', txt, re.MULTILINE)
          print('BuildName is now:', m.group() if m else '(not found)')
          "

      - name: "Inner Build: CTest dashboard start (initialise build record)"
        working-directory: build/BRAINSTools-Release-EPRelease-build
        shell: bash
        run: ctest -D ExperimentalStart

      - name: "Inner Build: CTest dashboard configure"
        working-directory: build/BRAINSTools-Release-EPRelease-build
        shell: bash
        run: ctest -D ExperimentalConfigure

      - name: "Inner Build: Compile BRAINSTools (CTest dashboard build)"
        id: inner_build
        working-directory: build/BRAINSTools-Release-EPRelease-build
        shell: bash
        run: ctest -D ExperimentalBuild -j ${{ matrix.config.parallel }}

      - name: "Inner Build: Run tests and collect results"
        # Disallow build: do not run tests when the build step failed.
        # ctest -D ExperimentalBuild exits non-zero when compilation errors
        # occur; skipping the test step avoids misleading CDash "0 tests passed"
        # submissions that obscure the real problem.
        if: steps.inner_build.outcome == 'success'
        working-directory: build/BRAINSTools-Release-EPRelease-build
        shell: bash
        # DO NOT use continue-on-error here.  ExperimentalSubmit already runs
        # unconditionally via `if: always()`, so CDash receives failure data
        # even when this step exits non-zero.  Using continue-on-error would
        # mask test failures from the GitHub Actions status check, causing the
        # PR to show a green checkmark despite failing tests.
        run: |
          # Exclude slow BCD (BRAINSConstellationDetector) tests via -E as a
          # belt-and-suspenders guard alongside CTEST_CUSTOM_TESTS_IGNORE in
          # CMake/CTestCustom.cmake.in.  The regex covers:
          #   ^BCD         — primary BCD tests (BCDTest_*, BCDTestForLandmarkCompare)
          #   ^chk_.*BCD   — checker tests (chk_BCDTest_*, chk_a_BCDTest*,
          #                  chk_i_BCDTest*) that abort when their BCD parent
          #                  was excluded and no output file was produced.
          # All BCD tests exceeded 5 minutes on GitHub-hosted runners
          # (worst: BCDTestForLandmarkCompare = 75 min).
          # Exclusion regex: tests that exceed 5 minutes on CI runners.
          # Timings measured locally on macOS arm64; CI is ~6x slower.
          #   BRAINSABCSmallTest          91.5 s local -> ~550 s (9 min) CI
          #   BCD tests + checkers:       already excluded (75-4531 s on CI)
          ctest -D ExperimentalTest --schedule-random --output-on-failure \
            -j ${{ matrix.config.parallel }} \
            -E "${CTEST_EXCLUDE_REGEX}"

      - name: "Inner Build: Check for CDash token"
        id: cdash_token
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.CDASH_TOKEN }}
        run: |
          if [ -n "${TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CDASH_TOKEN is not available (pull request from a fork); skipping CDash submission"
          fi

      - name: "Inner Build: Submit results to CDash"
        working-directory: build/BRAINSTools-Release-EPRelease-build
        shell: bash
        # if: always() — submit must run even when ExperimentalTest fails.
        # CTEST_AUTHTOKEN — my.cdash.org v4 rejects submissions without a
        # valid token (error: {"status":1,"description":"Invalid Token"}).
        # Generate a token at: https://my.cdash.org/user.php (Authentication
        # Tokens section) then store it as a repo secret named CDASH_TOKEN.
        if: ${{ always() && steps.cdash_token.outputs.present == 'true' }}
        env:
          CTEST_AUTHTOKEN: ${{ secrets.CDASH_TOKEN }}
        run: ctest -D ExperimentalSubmit --verbose

      - name: "Inner Build: Report BRAINSTools compiler warnings and errors"
        # Runs AFTER CDash submission so CDash always receives the full build
        # record before this step can fail the job.
        #
        # Behaviour:
        #   - Filters to BRAINSTools source only; ExternalProject (ITK, VTK,
        #     ANTs…) diagnostics from build/ subtree are suppressed.
        #   - Exits 0 if no BRAINSTools diagnostics found
        #   - Exits 1 if any warnings or errors found → CI step fails, PR is red
        #
        # Testing is already skipped on build failure via
        # `if: steps.inner_build.outcome == 'success'` above; this step adds a
        # second gate that makes build errors visible even when ctest itself
        # masked the error code.
        if: always()
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/Utilities/misc/report_build_diagnostics.py" \
            "${GITHUB_WORKSPACE}/build/BRAINSTools-Release-EPRelease-build" \
            "${GITHUB_WORKSPACE}"

      # ── Artifact upload ────────────────────────────────────────────────────────
      # ── Weekly sanitizer pass (scheduled or manual runs, Ubuntu only) ────────
      # Rebuilds only the inner BRAINSTools project with ASan and UBSan and
      # reruns its tests; ITK, VTK, and ANTs stay uninstrumented.  Runs after
      # the compiler cache is saved, so sanitized objects never enter it.
      - name: "Sanitizers: Rebuild inner BRAINSTools with ASan and UBSan"
        id: sanitizer_build
        if: ${{ !cancelled() && matrix.config.os == 'ubuntu-latest' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.config.itk_ref == '' }}
        working-directory: build/BRAINSTools-Release-EPRelease-build
        shell: bash
        # GoogleTest discovery runs each test binary during the build.
        env:
          ASAN_OPTIONS: detect_leaks=0:detect_container_overflow=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          # pointer-overflow is off: ITK 5.4 iterators built on unallocated images
          # (ScanlineFilterCommon, the v4 registration virtual domain) offset a null
          # buffer pointer inside ITK templates instantiated in BRAINSTools objects.
          SAN="-fsanitize=address,undefined -fno-sanitize=pointer-overflow -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake . \
            -DCMAKE_C_FLAGS="${{ matrix.config.arch_flags }} ${SAN}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.config.arch_flags }} ${SAN}" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build . --parallel ${{ matrix.config.parallel }}

      - name: "Sanitizers: Run tests"
        if: ${{ !cancelled() && steps.sanitizer_build.outcome == 'success' }}
        working-directory: build/BRAINSTools-Release-EPRelease-build
        shell: bash
        env:
          # Leaks at exit are not triaged yet, and container-overflow misfires
          # inside GoogleTest's own test registration.
          ASAN_OPTIONS: detect_leaks=0:detect_container_overflow=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --output-on-failure --timeout 1800 -j ${{ matrix.config.parallel }} \
            -E "${CTEST_EXCLUDE_REGEX}"

      - name: Summarize failure
        if: failure()
        shell: bash
        run: |
          INNER=build/BRAINSTools-Release-EPRelease-build
          {
            echo "### Failure diagnostics: ${{ matrix.config.name }}"
            echo '```'
            df -h . "${RUNNER_TEMP}"
            uptime
            if command -v free > /dev/null; then free -m; fi
            echo '```'
            for list in "${INNER}"/Testing/Temporary/LastTestsFailed*.log; do
              [ -s "${list}" ] || continue
              echo "Failed tests:"
              echo '```'
              head -50 "${list}"
              echo '```'
            done
            # ExternalProject steps with LOG_* ON write here instead of the job log.
            find build -path '*-stamp/*' -name '*-err.log' -size +0c 2> /dev/null | head -5 | while read -r log; do
              echo "Tail of ${log}:"
              echo '```'
              tail -n 40 "${log}"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: build-logs-${{ matrix.config.name }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/**/*-stamp/*-err.log
            build/**/*-stamp/*-out.log
            build/BRAINSTools-Release-EPRelease-build/CMakeFiles/CMakeOutput.log
            build/BRAINSTools-Release-EPRelease-build/CMakeFiles/CMakeError.log
            build/BRAINSTools-Release-EPRelease-build/Testing/Temporary/LastConfigure*.log
            build/BRAINSTools-Release-EPRelease-build/Testing/Temporary/LastBuild*.log
            build/BRAINSTools-Release-EPRelease-build/Testing/Temporary/LastTest*.log
            build/BRAINSTools-Release-EPRelease-build/Testing/Temporary/CTestCostData.txt
            build/BRAINSTools-Release-EPRelease-build/Testing/**/*.xml

  # ── Cache housekeeping ──────────────────────────────────────────────────────
  #
  # Background job: deletes ccache entries whose SHA-suffixed key has been
  # superseded by a newer build of the same (ref, OS, compiler).  restore-keys
  # only ever falls back to the newest prefix match, so older entries are dead
  # weight against the 10 GB per-repository cache budget.  Non-blocking: a fork
  # PR without actions:write must not redden a green build.
  prune-superseded-caches:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prune superseded caches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 Utilities/Maintenance/PruneSupersededCiCaches.py --keep 1
